<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Variables ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-body: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --sidebar-w: 300px;
}

[data-theme="dark"] {
  --bg-base: #0c0c0f;
  --bg-raised: #141419;
  --bg-surface: #1a1a22;
  --bg-surface-2: #22222e;
  --bg-input: #1e1e28;
  --border: #2a2a38;
  --border-focus: #5b5bf0;
  --text-primary: #e8e8f0;
  --text-secondary: #8888a0;
  --text-muted: #55556a;
  --accent: #6c6cf0;
  --accent-glow: rgba(108,108,240,0.15);
  --accent-text: #9d9dff;
  --user-bg: #2a2a50;
  --user-border: #3d3d70;
  --tool-bg: #1a1f2a;
  --tool-border: #2a3545;
  --tool-accent: #4ea8de;
  --error-bg: #2a1a1a;
  --error-border: #5a2a2a;
  --error-text: #f08080;
  --success: #5acea8;
  --scrollbar-track: #141419;
  --scrollbar-thumb: #2a2a38;
}

[data-theme="light"] {
  --bg-base: #f4f4f8;
  --bg-raised: #ffffff;
  --bg-surface: #f0f0f5;
  --bg-surface-2: #e8e8ef;
  --bg-input: #ffffff;
  --border: #d8d8e2;
  --border-focus: #5b5bf0;
  --text-primary: #1a1a2e;
  --text-secondary: #5a5a78;
  --text-muted: #9898a8;
  --accent: #5b5bf0;
  --accent-glow: rgba(91,91,240,0.1);
  --accent-text: #4a4ad0;
  --user-bg: #eeeeff;
  --user-border: #d0d0f0;
  --tool-bg: #eef5fa;
  --tool-border: #c8dce8;
  --tool-accent: #3a8cc0;
  --error-bg: #fff0f0;
  --error-border: #f0c0c0;
  --error-text: #c04040;
  --success: #2aa078;
  --scrollbar-track: #f0f0f5;
  --scrollbar-thumb: #d0d0d8;
}

html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg-base);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Scrollbar ─────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

/* ── Layout ────────────────────────────────────────────────────────── */
.app { display: flex; height: 100vh; width: 100%; }

.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-raised);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  transition: transform 0.3s var(--ease);
  z-index: 20;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ── Top Bar ───────────────────────────────────────────────────────── */
.topbar {
  height: 56px;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}

.topbar-logo {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.3px;
  color: var(--accent-text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar-logo .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px rgba(90,206,168,0.5);
  animation: pulse 2s infinite;
}
.topbar-logo .dot.idle { background: var(--text-muted); box-shadow: none; animation: none; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.topbar-model {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-surface);
  padding: 4px 10px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
}

.topbar-spacer { flex: 1; }

.topbar-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 10px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-body);
  transition: all 0.15s;
}
.topbar-btn:hover {
  background: var(--bg-surface);
  color: var(--text-primary);
  border-color: var(--border-focus);
}

.hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px;
}

/* ── Chat Area ─────────────────────────────────────────────────────── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
}

.chat-container {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ── Messages ──────────────────────────────────────────────────────── */
.msg {
  display: flex;
  gap: 12px;
  animation: msgIn 0.35s var(--ease) both;
  padding: 8px 0;
}
.msg.user { justify-content: flex-end; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-bubble {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.65;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.msg.assistant .msg-bubble {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) var(--radius) 4px;
}

.msg.user .msg-bubble {
  background: var(--user-bg);
  border: 1px solid var(--user-border);
  border-radius: var(--radius) var(--radius) 4px var(--radius);
  color: var(--text-primary);
}

.msg-bubble code {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--bg-surface-2);
  padding: 1px 5px;
  border-radius: 4px;
}

.msg-bubble pre {
  background: var(--bg-base);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin: 8px 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
}

.chat-img {
  max-width: 100%;
  max-height: 480px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin: 8px 0;
  display: block;
  cursor: pointer;
  transition: transform 0.2s;
}
.chat-img:hover { transform: scale(1.02); }
.chat-img.expanded {
  max-height: none;
  max-width: 90vw;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1000;
  border: 2px solid var(--border-focus);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  border-radius: var(--radius);
}
.file-download-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: var(--accent-glow, rgba(108,92,231,0.06));
  border: 1px solid var(--accent, #6c5ce7);
  border-radius: var(--radius-sm, 8px);
  color: var(--accent-text, #5a4dc8);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
  cursor: pointer;
  margin: 6px 0;
}
.file-download-link:hover {
  background: var(--accent, #6c5ce7);
  color: #fff;
  text-decoration: none;
}
.file-download-icon { font-size: 18px; }
.img-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 999;
  display: none;
}
.img-overlay.show { display: block; }

/* ── Tool Cards ────────────────────────────────────────────────────── */
.tool-card {
  background: var(--tool-bg);
  border: 1px solid var(--tool-border);
  border-radius: var(--radius-sm);
  margin: 6px 0;
  overflow: hidden;
  font-size: 13px;
  animation: msgIn 0.3s var(--ease) both;
  max-width: 85%;
}

.tool-card.error {
  background: var(--error-bg);
  border-color: var(--error-border);
}

.tool-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.tool-header:hover { background: var(--bg-surface-2); }

.tool-icon {
  width: 18px; height: 18px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}
.tool-icon.running { background: var(--accent); color: #fff; }
.tool-icon.done { background: var(--success); color: #fff; }
.tool-icon.error { background: var(--error-text); color: #fff; }

.tool-name {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--tool-accent);
  flex: 1;
}

.tool-chevron {
  color: var(--text-muted);
  transition: transform 0.2s;
  font-size: 12px;
}
.tool-card.open .tool-chevron { transform: rotate(90deg); }

.tool-body {
  display: none;
  padding: 0 12px 10px;
  border-top: 1px solid var(--tool-border);
}
.tool-card.open .tool-body { display: block; padding-top: 10px; }

.tool-section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.tool-content {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-base);
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  margin-bottom: 8px;
  max-height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

.tool-card.error .tool-content.result { color: var(--error-text); }

/* ── Thinking Indicator ────────────────────────────────────────────── */
.thinking {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 0;
  animation: msgIn 0.3s var(--ease) both;
}
.thinking-dots { display: flex; gap: 4px; }
.thinking-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.2s infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}
.thinking-text {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}

/* ── Input Area ────────────────────────────────────────────────────── */
.input-area {
  padding: 16px 24px 20px;
  background: var(--bg-raised);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-outer {
  max-width: 780px;
  margin: 0 auto;
}

.system-prompt-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: 8px;
  user-select: none;
  transition: color 0.15s;
}
.system-prompt-toggle:hover { color: var(--text-secondary); }
.system-prompt-toggle .chevron {
  font-size: 10px;
  transition: transform 0.2s;
}
.system-prompt-toggle.open .chevron { transform: rotate(90deg); }
.system-prompt-toggle.has-content { color: var(--accent-text); }

.system-prompt-wrap {
  display: none;
  margin-bottom: 10px;
}
.system-prompt-wrap.open { display: block; }

.system-prompt-field {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.5;
  resize: vertical;
  min-height: 60px;
  max-height: 200px;
  outline: none;
  transition: border-color 0.15s;
}
.system-prompt-field::placeholder { color: var(--text-muted); }
.system-prompt-field:focus { border-color: var(--border-focus); }

.input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.input-field {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.5;
  resize: none;
  min-height: 46px;
  max-height: 200px;
  outline: none;
  transition: border-color 0.15s;
}
.input-field::placeholder { color: var(--text-muted); }
.input-field:focus { border-color: var(--border-focus); }

.send-btn {
  width: 46px;
  height: 46px;
  border-radius: var(--radius);
  background: var(--accent);
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.send-btn:hover { filter: brightness(1.15); transform: scale(1.03); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 20px; height: 20px; }

/* ── Sidebar ───────────────────────────────────────────────────────── */
.sb-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.sb-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.sb-stat {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 4px 0;
}
.sb-stat-label { color: var(--text-secondary); }
.sb-stat-value { font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); }

.sb-tool {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  padding: 4px 8px;
  background: var(--bg-surface);
  border-radius: var(--radius-xs);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sb-tool .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
}

.sb-mcp-server {
  padding: 8px 10px;
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  border: 1px solid var(--border);
}
.sb-mcp-name {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sb-mcp-name .badge {
  font-size: 10px;
  font-family: var(--font-mono);
  background: var(--bg-surface-2);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--text-muted);
}
.sb-mcp-tools { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

.sb-btn {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-secondary);
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 13px;
  margin-bottom: 6px;
  transition: all 0.15s;
}
.sb-btn:hover { background: var(--bg-surface-2); color: var(--text-primary); border-color: var(--border-focus); }

/* MCP connect form */
.mcp-form { display: none; flex-direction: column; gap: 6px; margin-top: 8px; }
.mcp-form.open { display: flex; }
.mcp-input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 6px 10px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
}
.mcp-input:focus { border-color: var(--border-focus); }
.mcp-input::placeholder { color: var(--text-muted); }

/* ── Empty State ───────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  gap: 12px;
  padding: 40px;
  text-align: center;
}
.empty-state-icon {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.empty-state-title { font-size: 17px; font-weight: 600; color: var(--text-secondary); }
.empty-state-sub { font-size: 13px; max-width: 360px; line-height: 1.6; }

/* ── Mobile ────────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); box-shadow: 10px 0 40px rgba(0,0,0,0.4); }
  .hamburger { display: block; }
  .msg-bubble { max-width: 92%; }
  .chat-container { padding: 0 14px; }
  .input-area { padding: 12px 14px 16px; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 15; }
  .overlay.show { display: block; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="img-overlay" id="img-overlay" onclick="closeImageExpand()"></div>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-section">
      <div class="sb-title">Agent Status</div>
      <div class="sb-stat">
        <span class="sb-stat-label">Status</span>
        <span class="sb-stat-value" id="sb-status">idle</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-label">Model</span>
        <span class="sb-stat-value" id="sb-model">—</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-label">Session</span>
        <span class="sb-stat-value" id="sb-session">—</span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-title">Token Usage</div>
      <div class="sb-stat">
        <span class="sb-stat-label">Input</span>
        <span class="sb-stat-value" id="sb-input-tokens">0</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-label">Output</span>
        <span class="sb-stat-value" id="sb-output-tokens">0</span>
      </div>
      <div class="sb-stat">
        <span class="sb-stat-label">Est. Cost</span>
        <span class="sb-stat-value" id="sb-cost">$0.0000</span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-title">MCP Servers</div>
      <div id="mcp-servers-list"></div>
      <button class="sb-btn" onclick="toggleMCPForm()">+ Connect Server</button>
      <div class="mcp-form" id="mcp-form">
        <input class="mcp-input" id="mcp-name" placeholder="Server name" />
        <input class="mcp-input" id="mcp-command" placeholder="Command (e.g. python3)" />
        <input class="mcp-input" id="mcp-args" placeholder="Args (space-separated)" />
        <input class="mcp-input" id="mcp-url" placeholder="Or SSE URL" />
        <button class="sb-btn" onclick="connectMCP()" style="background:var(--accent);color:#fff;border-color:var(--accent);">Connect</button>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-title">Tools</div>
      <div id="tools-list"></div>
    </div>

    <div class="sb-section">
      <div class="sb-title">Session</div>
      <button class="sb-btn" onclick="saveSession()">Save Session</button>
      <button class="sb-btn" onclick="clearSession()">New Session</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-logo">
        <span class="dot" id="status-dot"></span>
        Agent Harness
      </div>
      <span class="topbar-model" id="topbar-model">loading...</span>
      <div class="topbar-spacer"></div>
      <button class="topbar-btn" onclick="toggleTheme()" id="theme-btn">Light</button>
    </header>

    <div class="chat-area" id="chat-area">
      <div class="chat-container" id="chat-container">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-icon">&#9670;</div>
          <div class="empty-state-title">Agent Harness</div>
          <div class="empty-state-sub">
            AI agent with tools, MCP servers, sandboxed execution, and full lifecycle management. Type a message to begin.
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-outer">
        <div class="system-prompt-toggle" id="sp-toggle" onclick="toggleSystemPrompt()">
          <span class="chevron">&#9654;</span> System Prompt
        </div>
        <div class="system-prompt-wrap" id="sp-wrap">
          <textarea class="system-prompt-field" id="system-prompt" rows="3" placeholder="Enter a system prompt for the agent..."></textarea>
        </div>
        <div class="input-wrap">
          <textarea class="input-field" id="input" rows="1" placeholder="Message the agent..." autofocus></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let isStreaming = false;

// ── Theme ─────────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  document.getElementById('theme-btn').textContent = next === 'dark' ? 'Light' : 'Dark';
  localStorage.setItem('theme', next);
}
(() => {
  const saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.dataset.theme = saved;
    document.getElementById('theme-btn').textContent = saved === 'dark' ? 'Light' : 'Dark';
  }
})();

// ── Sidebar (mobile) ──────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// ── Auto-resize textarea ──────────────────────────────────────────────
const input = document.getElementById('input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Base64 image detection ────────────────────────────────────────────
function detectAndReplaceBase64(text) {
  // Match known image base64 prefixes: PNG, JPEG, GIF, WebP
  // These can appear inline, on their own line, or inside code fences
  const patterns = [
    { prefix: 'iVBOR', mime: 'png' },
    { prefix: '/9j/',  mime: 'jpeg' },
    { prefix: 'R0lG',  mime: 'gif' },
    { prefix: 'UklG',  mime: 'webp' },
  ];

  for (const { prefix, mime } of patterns) {
    // Match the prefix followed by base64 chars (at least 200 chars = real image)
    const re = new RegExp('(' + prefix.replace(/\//g, '\\/') + '[A-Za-z0-9+/=\\n\\r]{200,})', 'g');
    text = text.replace(re, (match, b64) => {
      // Strip any whitespace/newlines from the base64
      const clean = b64.replace(/[\s\n\r]/g, '');
      return `%%BASE64_IMG_data:image/${mime};base64,${clean}%%`;
    });
  }

  // Also match data:image/... URIs
  text = text.replace(/(data:image\/[a-z]+;base64,[A-Za-z0-9+/=]{200,})/g, (match) => {
    return `%%BASE64_IMG_${match}%%`;
  });

  return text;
}

// ── Markdown-lite rendering ───────────────────────────────────────────
function renderMarkdown(text) {
  // Step 1: Detect base64 images and replace with placeholders BEFORE any escaping
  text = detectAndReplaceBase64(text);

  // Step 2: Extract placeholders
  const images = [];
  text = text.replace(/%%BASE64_IMG_(data:image\/[^%]+)%%/g, (match, src) => {
    images.push(src);
    return `%%IMG_${images.length - 1}%%`;
  });

  // Step 3: Normal markdown rendering with HTML escaping
  text = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  // Step 4: Restore images as <img> tags
  images.forEach((src, i) => {
    text = text.replace(`%%IMG_${i}%%`, `<img src="${src}" class="chat-img" />`);
  });

  return text;
}

// ── Add message to chat ──────────────────────────────────────────────
function addMessage(role, content) {
  document.getElementById('empty-state')?.remove();
  const container = document.getElementById('chat-container');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-bubble">${role === 'user' ? escapeHtml(content) : renderMarkdown(content)}</div>`;
  container.appendChild(div);
  scrollToBottom();
  return div;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── Streaming assistant bubble ────────────────────────────────────────
function addStreamingBubble() {
  document.getElementById('empty-state')?.remove();
  const container = document.getElementById('chat-container');
  const div = document.createElement('div');
  div.className = 'msg assistant streaming-active';
  div.innerHTML = `<div class="msg-bubble"></div>`;
  container.appendChild(div);
  return div.querySelector('.msg-bubble');
}

// Auto-clean: remove any empty assistant bubbles every 500ms during streaming
setInterval(() => {
  if (!isStreaming) return;
  document.querySelectorAll('#chat-container .msg.assistant .msg-bubble').forEach(b => {
    if (!b.textContent.trim() && !b.innerHTML.trim() && !b.closest('.streaming-active')) {
      b.closest('.msg')?.remove();
    }
  });
}, 500);

// ── Tool card ─────────────────────────────────────────────────────────
function addToolCard(name, inputData, id) {
  const container = document.getElementById('chat-container');
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.id = `tool-${id || name}`;
  card.innerHTML = `
    <div class="tool-header" onclick="this.parentElement.classList.toggle('open')">
      <div class="tool-icon running">&#9881;</div>
      <span class="tool-name">${name}</span>
      <span class="tool-chevron">&#9654;</span>
    </div>
    <div class="tool-body">
      <div class="tool-section-label">Input</div>
      <div class="tool-content">${typeof inputData === 'string' ? inputData : JSON.stringify(inputData, null, 2)}</div>
      <div class="tool-section-label">Result</div>
      <div class="tool-content result" id="tool-result-${id || name}">Running...</div>
    </div>
  `;
  container.appendChild(card);
  scrollToBottom();
  return card;
}

function updateToolCard(id, content, isError) {
  const card = document.getElementById(`tool-${id}`);
  if (!card) return;
  const resultEl = document.getElementById(`tool-result-${id}`);
  if (resultEl) {
    // Check if tool result contains base64 image data
    const imgHtml = tryRenderBase64(content);
    if (imgHtml) {
      resultEl.innerHTML = imgHtml;
    } else {
      const fileHtml = tryRenderFileLink(content);
      if (fileHtml) {
        resultEl.innerHTML = fileHtml;
      } else {
        resultEl.textContent = content;
      }
    }
  }
  const icon = card.querySelector('.tool-icon');
  if (isError) {
    card.classList.add('error');
    icon.className = 'tool-icon error';
    icon.innerHTML = '&#10007;';
  } else {
    icon.className = 'tool-icon done';
    icon.innerHTML = '&#10003;';
  }
}

function tryRenderBase64(text) {
  // Check if text contains base64 image data
  const prefixes = [
    { re: /iVBOR[A-Za-z0-9+/=\s]{200,}/, mime: 'png' },
    { re: /\/9j\/[A-Za-z0-9+/=\s]{200,}/, mime: 'jpeg' },
    { re: /R0lG[A-Za-z0-9+/=\s]{200,}/, mime: 'gif' },
    { re: /UklG[A-Za-z0-9+/=\s]{200,}/, mime: 'webp' },
  ];
  for (const { re, mime } of prefixes) {
    const match = text.match(re);
    if (match) {
      const clean = match[0].replace(/[\s\n\r]/g, '');
      return `<img src="data:image/${mime};base64,${clean}" class="chat-img" />`;
    }
  }
  // data:image URI
  const dataMatch = text.match(/data:image\/[a-z]+;base64,[A-Za-z0-9+/=]{200,}/);
  if (dataMatch) {
    return `<img src="${dataMatch[0]}" class="chat-img" />`;
  }
  return null;
}

function tryRenderFileLink(text) {
  const lines = text.split('\n').filter(l => l.startsWith('__FILE__:'));
  if (lines.length === 0) return null;
  return lines.map(line => {
    const rest = line.substring('__FILE__:'.length);
    const colonIdx = rest.indexOf(':', 1);
    if (colonIdx === -1) return '';
    const url = rest.substring(0, colonIdx);
    const displayName = rest.substring(colonIdx + 1);
    const filename = url.split('/').pop();
    return `<a href="${url}" download="${filename}" class="file-download-link">
      <span class="file-download-icon">&#8615;</span> ${displayName}
    </a>`;
  }).join('');
}

// ── Thinking indicator ────────────────────────────────────────────────
function addThinking() {
  const container = document.getElementById('chat-container');
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking-indicator';
  div.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div><span class="thinking-text">Agent is thinking...</span>`;
  container.appendChild(div);
  scrollToBottom();
}

function removeThinking() {
  document.getElementById('thinking-indicator')?.remove();
}

function scrollToBottom() {
  const area = document.getElementById('chat-area');
  requestAnimationFrame(() => area.scrollTop = area.scrollHeight);
}

// ── System prompt toggle ─────────────────────────────────────────────
function toggleSystemPrompt() {
  const toggle = document.getElementById('sp-toggle');
  const wrap = document.getElementById('sp-wrap');
  toggle.classList.toggle('open');
  wrap.classList.toggle('open');
  if (wrap.classList.contains('open')) {
    document.getElementById('system-prompt').focus();
  }
}
document.getElementById('system-prompt').addEventListener('input', () => {
  const toggle = document.getElementById('sp-toggle');
  const val = document.getElementById('system-prompt').value.trim();
  toggle.classList.toggle('has-content', val.length > 0);
});

// ── Send message (streaming) ──────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isStreaming) return;

  const systemPrompt = document.getElementById('system-prompt').value.trim() || null;

  input.value = '';
  input.style.height = 'auto';
  isStreaming = true;
  setAgentStatus('running');
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  addThinking();

  try {
    const body = { message: text };
    if (systemPrompt) body.system_prompt = systemPrompt;

    const response = await fetch(`${API}/api/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let bubble = null;
    let segText = '';
    let buffer = '';

    function killBubble() {
      if (bubble) {
        const msg = bubble.closest('.msg');
        if (msg && !bubble.textContent.trim() && !bubble.querySelector('img')) {
          msg.remove();
        } else if (msg) {
          msg.classList.remove('streaming-active');
        }
      }
      bubble = null;
      segText = '';
    }

    function cleanEmptyBubbles() {
      document.querySelectorAll('#chat-container .msg.assistant').forEach(el => {
        const b = el.querySelector('.msg-bubble');
        if (b && !b.textContent.trim() && !b.querySelector('img') && !b.innerHTML.trim()) {
          el.remove();
        }
      });
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;

        let ev;
        try { ev = JSON.parse(raw); } catch { continue; }

        switch (ev.type) {
          case 'text_delta':
            removeThinking();
            segText += ev.content;
            if (segText.trim().length > 0) {
              if (!bubble) bubble = addStreamingBubble();
              bubble.innerHTML = renderMarkdown(segText);
              scrollToBottom();
            }
            break;

          case 'text_complete':
            segText = ev.content || '';
            if (!bubble && segText.trim()) bubble = addStreamingBubble();
            if (bubble) bubble.innerHTML = renderMarkdown(segText);
            killBubble();
            break;

          case 'attempt_reset':
            if (bubble) bubble.closest('.msg').remove();
            bubble = null;
            segText = '';
            break;

          case 'tool_call_start':
            killBubble();
            removeThinking();
            cleanEmptyBubbles();
            addToolCard(ev.name, ev.input, ev.id);
            scrollToBottom();
            break;

          case 'tool_result':
            updateToolCard(ev.tool_call_id, ev.content, ev.is_error);
            addThinking();
            scrollToBottom();
            break;

          case 'turn_complete':
            removeThinking();
            killBubble();
            cleanEmptyBubbles();
            if (ev.usage) updateUsage(ev.usage);
            break;

          case 'error':
            removeThinking();
            if (!bubble) bubble = addStreamingBubble();
            bubble.innerHTML = `<span style="color:var(--error-text)">Error: ${escapeHtml(ev.content)}</span>`;
            break;
        }
      }
    }

    // Final cleanup after stream ends
    killBubble();
    cleanEmptyBubbles();
  } catch (err) {
    removeThinking();
    addMessage('assistant', `Connection error: ${err.message}`);
  }

  isStreaming = false;
  setAgentStatus('idle');
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── Status updates ────────────────────────────────────────────────────
function setAgentStatus(status) {
  document.getElementById('sb-status').textContent = status;
  const dot = document.getElementById('status-dot');
  dot.className = status === 'running' ? 'dot' : 'dot idle';
}

function updateUsage(usage) {
  document.getElementById('sb-input-tokens').textContent = (usage.input_tokens || 0).toLocaleString();
  document.getElementById('sb-output-tokens').textContent = (usage.output_tokens || 0).toLocaleString();
  document.getElementById('sb-cost').textContent = usage.estimated_cost || '$0.0000';
}

// ── Fetch initial status ──────────────────────────────────────────────
async function fetchStatus() {
  try {
    const res = await fetch(`${API}/api/status`);
    const data = await res.json();

    document.getElementById('topbar-model').textContent = data.model || '—';
    document.getElementById('sb-model').textContent = (data.model || '—').replace('claude-', '').substring(0, 16);
    document.getElementById('sb-session').textContent = (data.session_id || '—').substring(0, 8);
    if (data.usage) updateUsage(data.usage);

    // Tools
    const toolsList = document.getElementById('tools-list');
    toolsList.innerHTML = '';
    for (const t of (data.tools || [])) {
      const div = document.createElement('div');
      div.className = 'sb-tool';
      div.innerHTML = `<span class="dot"></span>${t}`;
      toolsList.appendChild(div);
    }

    // MCP servers
    const mcpList = document.getElementById('mcp-servers-list');
    mcpList.innerHTML = '';
    for (const [name, info] of Object.entries(data.mcp_servers || {})) {
      const div = document.createElement('div');
      div.className = 'sb-mcp-server';
      div.innerHTML = `
        <div class="sb-mcp-name">${name} <span class="badge">${info.transport}</span></div>
        <div class="sb-mcp-tools">${(info.tools || []).join(', ')}</div>
      `;
      mcpList.appendChild(div);
    }
  } catch {}
}

// ── MCP connect ───────────────────────────────────────────────────────
function toggleMCPForm() {
  document.getElementById('mcp-form').classList.toggle('open');
}

async function connectMCP() {
  const name = document.getElementById('mcp-name').value.trim();
  const command = document.getElementById('mcp-command').value.trim() || null;
  const args = document.getElementById('mcp-args').value.trim().split(/\s+/).filter(Boolean);
  const url = document.getElementById('mcp-url').value.trim() || null;

  if (!name || (!command && !url)) return alert('Name and command or URL required');

  try {
    const res = await fetch(`${API}/api/mcp/connect`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, command, args, url }),
    });
    const data = await res.json();
    document.getElementById('mcp-form').classList.remove('open');
    document.getElementById('mcp-name').value = '';
    document.getElementById('mcp-command').value = '';
    document.getElementById('mcp-args').value = '';
    document.getElementById('mcp-url').value = '';
    fetchStatus();
  } catch (err) {
    alert('Failed to connect: ' + err.message);
  }
}

// ── Session ───────────────────────────────────────────────────────────
async function saveSession() {
  try {
    const res = await fetch(`${API}/api/session/save`, { method: 'POST' });
    const data = await res.json();
    alert('Session saved: ' + data.session_id.substring(0, 8));
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function clearSession() {
  try {
    await fetch(`${API}/api/session/clear`, { method: 'POST' });
    document.getElementById('chat-container').innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">&#9670;</div>
        <div class="empty-state-title">Agent Harness</div>
        <div class="empty-state-sub">Session cleared. Type a message to begin.</div>
      </div>`;
    fetchStatus();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

// ── Init ──────────────────────────────────────────────────────────────
fetchStatus();
setInterval(fetchStatus, 15000);

// ── Image expand on click ─────────────────────────────────────────────
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('chat-img') && !e.target.classList.contains('expanded')) {
    e.target.classList.add('expanded');
    document.getElementById('img-overlay').classList.add('show');
  }
});

function closeImageExpand() {
  document.querySelectorAll('.chat-img.expanded').forEach(img => img.classList.remove('expanded'));
  document.getElementById('img-overlay').classList.remove('show');
}
</script>
