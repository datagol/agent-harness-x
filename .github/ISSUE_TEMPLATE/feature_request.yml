name: Feature request
description: Propose a change to the SDK
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Sketch the call or configuration you would want to write.
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
