[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datagol-agent-harness"
version = "0.2.0"
description = "A DIY agent harness with provider-agnostic LLM support (Anthropic, OpenAI), MCP, skills, and sandboxed tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jyotish Bora", email = "jyotish.bora@datagol.ai" },
]
keywords = ["agent", "llm", "anthropic", "openai", "mcp", "skills", "evals", "langsmith"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.83.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.1.0"]
openai = ["openai>=1.50.0", "tiktoken>=0.7.0"]
mcp = ["mcp[cli]>=1.0.0"]
docker = ["docker>=7.0.0"]
server = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "python-dotenv>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "langsmith>=0.1.0",
    "openai>=1.50.0",
    "tiktoken>=0.7.0",
    "mcp[cli]>=1.0.0",
    "docker>=7.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/inncretech/datagol-agent-harness"
Repository = "https://github.com/inncretech/datagol-agent-harness"
Issues = "https://github.com/inncretech/datagol-agent-harness/issues"
Documentation = "https://github.com/inncretech/datagol-agent-harness#readme"

[tool.setuptools.packages.find]
include = ["datagol_agent_harness*"]
exclude = ["apps*", "examples*", "tests*"]

[tool.setuptools.package-data]
datagol_agent_harness = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
