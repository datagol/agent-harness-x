[project]
name = "agent-harness"
version = "0.2.0"
description = "A DIY agent harness with provider-agnostic LLM support (Anthropic, OpenAI), MCP, skills, and sandboxed tools."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.83.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50.0", "tiktoken>=0.7.0"]
mcp = ["mcp[cli]>=1.0.0"]
docker = ["docker>=7.0.0"]
server = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "python-dotenv>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "openai>=1.50.0",
    "tiktoken>=0.7.0",
    "mcp[cli]>=1.0.0",
    "docker>=7.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_harness*"]
exclude = ["apps*", "examples*", "tests*"]

[tool.setuptools.package-data]
agent_harness = ["py.typed"]
