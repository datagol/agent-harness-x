[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessx"
version = "0.4.3"
description = "A lightweight, production-grade LLM agent toolkit in Python: streaming, MCP, lazy skills, memory, and sandboxing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jyotish Bora", email = "jyotish.bora@datagol.ai" },
]
keywords = [
    "agent",
    "ai-agents",
    "llm",
    "anthropic",
    "claude",
    "openai",
    "mcp",
    "model-context-protocol",
    "sandboxing",
    "langsmith",
    "multi-agent",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "anthropic>=0.83.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.1,<0.8"]
postgres = ["psycopg[binary,pool]>=3.2"]
temporal = ["temporalio>=1.9", "redis>=5", "boto3>=1.35"]
langsmith = ["langsmith>=0.1.0"]
openai = ["openai>=1.50.0", "tiktoken>=0.7.0"]
openrouter = ["openai>=1.50.0", "tiktoken>=0.7.0"]
azure = ["openai>=1.50.0", "tiktoken>=0.7.0"]
gemini = ["google-genai>=1.0.0"]
mcp = ["mcp[cli]>=1.0.0"]
docker = ["docker>=7.0.0"]
server = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "python-dotenv>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.18", "build>=1.2", "ruff>=0.14"]
all = ["harnessx[jev,postgres,temporal,langsmith,openai,azure,gemini,mcp,docker,server]"]

[project.scripts]
harnessx-evals = "harnessx.evals.cli:main"

[project.urls]
Homepage = "https://github.com/datagol/agent-harness-x"
Repository = "https://github.com/datagol/agent-harness-x"
Issues = "https://github.com/datagol/agent-harness-x/issues"
Documentation = "https://github.com/datagol/agent-harness-x#readme"

[tool.setuptools.packages.find]
include = ["harnessx*"]
exclude = ["apps*", "examples*", "tests*"]

[tool.setuptools.package-data]
harnessx = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["harness-web/node_modules", "harness-web/dist", "dist", "build", "doc"]

[tool.ruff.lint]
# A deliberately small baseline: syntax, pyflakes, and undefined names.
# Style rules can be added later once the tree is clean under them.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package roots re-export their public API.
"__init__.py" = ["F401"]
# Environment must be prepared before these modules import their dependencies.
"harnessx/evals/cli.py" = ["E402"]
"tests/test_jev_decisions.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["harnessx/types.py", "harnessx/errors.py", "harnessx/durable.py", "harnessx/providers/registry.py", "harnessx/providers/retry.py", "harnessx/providers/fallback.py", "harnessx/messages.py", "harnessx/execution.py", "harnessx/subagents.py", "harnessx/recorder.py", "harnessx/_journal.py", "harnessx/decisions", "tests/typing/sdk_usage.py", "tests/typing/decision_usage.py", "examples", "harness-web/harness_web", "harness-web/run.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
